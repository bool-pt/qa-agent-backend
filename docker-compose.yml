# Single-service compose file for the OutSystems ONE 2026 lab backend.
# Quickstart for attendees:
#   1. cp .env.example .env  &&  edit .env (5 required vars)
#   2. docker compose up -d
#   3. docker compose logs -f
#
# `image:` is the published GHCR tag (default for `docker compose pull`).
# `build: .` is a local-build fallback if the image isn't available or if
# you've cloned the repo and want to iterate. Override the image owner with
# IMAGE_OWNER in .env if you fork the repo (e.g. IMAGE_OWNER=acme-corp).

services:
  qa-agent-backend:
    image: ghcr.io/${IMAGE_OWNER:-outsystems-one-2026-lab}/qa-agent-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qa-agent-backend
    env_file:
      - .env
    # Pass the host's X display through so the agent's Chromium renders on the
    # attendee's screen (lab demo: they watch the agent click around in real
    # time). Requires a Linux host/VM with an X server. Mac/Windows users would
    # need XQuartz / VcXsrv. Run `xhost +local:` once on the host so the
    # container (uid 0) is allowed to connect to the X socket.
    environment:
      - DISPLAY=${DISPLAY:-:0}
    # Share the host IPC namespace so X11 MIT-SHM works. The X server passes
    # pixmaps and screenshot buffers via SysV shared-memory segments; with the
    # container in its own IPC namespace, Chromium can't shmat() them and
    # silently falls back to the socket protocol for every paint and snapshot.
    # The window still renders, but every agent action is glacial.
    ipc: host
    ports:
      - "${PORT:-3100}:3100"
    volumes:
      - ./artifacts:/data/workspace-qa
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    restart: unless-stopped
    # Chromium plus the gateway is hungry; bump from Docker Desktop's 2 GB
    # default if you see OOM-killed processes during long test runs.
    deploy:
      resources:
        limits:
          memory: 4G
